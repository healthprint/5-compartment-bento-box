<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>健築家 健康五格自由砌</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg-cream: #FAF5E8;
      --paper-bg: #FFFFFF;
      --primary-orange: #D9531E;
      --text-dark: #2A2521;
      --text-muted: #756D65;
      --border-color: #E6DCBF;
      --slot-bg: #FFFDF9;
      --radius: 16px;
      --shadow: 0 4px 18px rgba(160, 110, 50, 0.08);
    }
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang HK", "Microsoft JhengHei", sans-serif; 
      -webkit-tap-highlight-color: transparent; 
    }
    body { 
      background-color: var(--bg-cream); 
      color: var(--text-dark); 
      padding: 10px 12px 36px 12px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
    }
    header { 
      width: 100%; 
      max-width: 460px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 4px 2px 8px 2px; 
    }
    .brand-logo { 
      display: flex; 
      align-items: center; 
      gap: 10px; 
    }
    .brand-logo h1 { 
      font-size: 1.35rem; 
      font-weight: 900; 
      color: var(--primary-orange); 
      letter-spacing: 0.5px; 
    }
    .cloud-status { 
      font-size: 0.68rem; 
      padding: 3px 8px; 
      border-radius: 12px; 
      background: #E8F5E9; 
      color: #2E7D32; 
      border: 1px solid #C8E6C9; 
      font-weight: 700; 
      display: flex; 
      align-items: center; 
      gap: 3px; 
      flex-shrink: 0;
    }
    .cap-notice-banner { 
      width: 100%; 
      max-width: 460px; 
      background: #FFF1DF; 
      border: 1px solid #F8D2B0; 
      color: #B54512; 
      font-size: 0.78rem; 
      font-weight: 700; 
      padding: 7px 10px; 
      border-radius: 10px; 
      text-align: center; 
      margin-bottom: 8px; 
    }
    .controls-wrapper { 
      width: 100%; 
      max-width: 460px; 
      display: flex; 
      gap: 8px; 
      margin-bottom: 10px; 
    }
    .btn-draw-large { 
      flex: 2; 
      background: linear-gradient(135deg, #E65C00 0%, #D84315 100%); 
      color: white; 
      border: none; 
      font-size: 1.05rem; 
      font-weight: 800; 
      padding: 12px 10px; 
      border-radius: 26px; 
      box-shadow: 0 4px 14px rgba(216, 67, 21, 0.35); 
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 6px; 
    }
    .btn-draw-large:active { transform: scale(0.98); }
    .btn-copy-small { 
      flex: 1; 
      background: #FFFFFF; 
      border: 1.5px solid var(--primary-orange); 
      color: var(--primary-orange); 
      font-size: 0.8rem; 
      font-weight: 700; 
      border-radius: 26px; 
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 4px; 
    }
    .bento-card { 
      width: 100%; 
      max-width: 460px; 
      background: var(--paper-bg); 
      border: 2px solid var(--border-color); 
      border-radius: var(--radius); 
      box-shadow: var(--shadow); 
      padding: 11px 12px; 
    }
    .bento-header { 
      display: flex; 
      justify-content: space-between; 
      align-items: flex-end; 
      padding-bottom: 8px; 
      margin-bottom: 8px; 
      border-bottom: 1.5px dashed var(--border-color); 
    }
    .bento-badge { 
      background: #E8F5E9; 
      color: #2E7D32; 
      font-size: 0.72rem; 
      font-weight: 800; 
      padding: 3px 8px; 
      border-radius: 12px; 
      border: 1px solid #C8E6C9; 
    }
    .bento-info-tag { text-align: right; }
    .bento-price-tag { 
      font-size: 0.92rem; 
      font-weight: 900; 
      color: var(--primary-orange); 
      line-height: 1.2; 
    }
    .bento-calorie-tag { 
      font-size: 0.75rem; 
      font-weight: 800; 
      color: #E65100; 
      margin-top: 2px; 
    }
    .slots-list { 
      display: flex; 
      flex-direction: column; 
      gap: 7px; 
    }
    .slot-row { 
      display: flex; 
      align-items: center; 
      background: var(--slot-bg); 
      border: 1px solid #EFE4CA; 
      border-radius: 10px; 
      padding: 6px 8px; 
      gap: 8px; 
    }
    .slot-label { 
      width: 74px; 
      flex-shrink: 0; 
      font-size: 0.72rem; 
      font-weight: 800; 
      text-align: center; 
      padding: 4px 0; 
      border-radius: 6px; 
      line-height: 1.2; 
    }
    .lbl-protein { background: #FFE0B2; color: #BF360C; }
    .lbl-carb    { background: #FFF9C4; color: #F57F17; }
    .lbl-veggie  { background: #DCEDC8; color: #33691E; }
    .lbl-side    { background: #E1F5FE; color: #0277BD; }
    .lbl-sauce   { background: #F3E5F5; color: #7B1FA2; }
    
    .slot-dish-list { 
      flex: 1; 
      display: flex; 
      flex-direction: column; 
      gap: 3px; 
      min-width: 0; 
    }
    .slot-dish-item { 
      font-size: 0.81rem; 
      font-weight: 700; 
      color: var(--text-dark); 
      white-space: normal; 
      word-break: break-word; 
      line-height: 1.35; 
      display: flex; 
      align-items: flex-start; 
      justify-content: space-between; 
      gap: 4px; 
    }
    .slot-dish-text { flex: 1; }
    .slot-dish-tag { 
      font-size: 0.65rem; 
      color: #888; 
      white-space: nowrap; 
      flex-shrink: 0; 
      margin-top: 1px; 
    }
    .slot-dish-item.empty { 
      color: #9E9E9E; 
      font-weight: normal; 
      font-size: 0.78rem; 
    }

    /* 醬汁專屬可剔選框樣式 */
    .sauce-option-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-dark);
      cursor: pointer;
      line-height: 1.35;
      padding: 3px 0;
      user-select: none;
    }
    .sauce-checkbox {
      width: 18px;
      height: 18px;
      accent-color: #7B1FA2;
      cursor: pointer;
      flex-shrink: 0;
    }
    .sauce-text {
      flex: 1;
    }
    .sauce-hint {
      font-size: 0.62rem;
      color: #7B1FA2;
      background: #F3E5F5;
      padding: 1px 6px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .btn-reroll-cat { 
      background: none; 
      border: none; 
      font-size: 0.95rem; 
      color: #BDBDBD; 
      cursor: pointer; 
      padding: 0 4px; 
      flex-shrink: 0; 
    }
    .btn-reroll-cat:hover { color: var(--primary-orange); }

    .bento-stamps-bar { 
      margin-top: 10px; 
      padding-top: 9px; 
      border-top: 1px dotted var(--border-color); 
      display: grid; 
      grid-template-columns: 1fr 1.25fr 1fr; 
      gap: 5px; 
      align-items: center; 
    }
    .stamp-box { 
      border-radius: 8px; 
      padding: 4px 2px; 
      text-align: center; 
      font-weight: 700; 
    }
    .stamp-left { background: #FFF5EE; color: #C0392B; font-size: 0.68rem; line-height: 1.2; }
    .stamp-mid { background: #F1F8F1; border: 1px solid #D4ECD5; padding: 3px 2px; }
    .stamp-mid-top { font-size: 0.62rem; color: #4B6F44; line-height: 1.15; }
    .stamp-mid-bot { font-size: 0.75rem; font-weight: 900; color: #1B5E20; line-height: 1.15; }
    .stamp-right { background: #FFFDF0; color: #8D6E63; font-size: 0.68rem; line-height: 1.2; }
    .visitor-lock-hint { 
      font-size: 0.72rem; 
      color: #8C7853; 
      text-align: center; 
      margin-top: 10px; 
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-logo">
      <span id="siteLogo" style="display:flex; align-items:center;">🥕</span>
      <h1 id="siteTitle">健築家 健康五格自由砌</h1>
    </div>
    <div class="cloud-status" id="cloudStatus">
      <span>☁️️</span> <span>已同步</span>
    </div>
  </header>

  <div class="cap-notice-banner" id="siteNotice">
    📸 抽啱心水？歡迎直接截圖 (Cap 圖) 落單！
  </div>

  <div class="controls-wrapper">
    <button class="btn-draw-large" onclick="drawAllDishes()">
      <span>🎲</span> 隨機抽今日餐單！
    </button>
    <button class="btn-copy-small" onclick="copyMenuText()">
      <span>📋</span> 複製文字
    </button>
  </div>

  <div class="bento-card" id="bentoCard">
    <div class="bento-header">
      <div class="bento-badge" id="bentoTitleBadge">🍱 五格自由砌 (共5品)</div>
      <div class="bento-info-tag">
        <div class="bento-price-tag" id="bentoPriceTag">套餐：$58起</div>
        <div class="bento-calorie-tag" id="bentoCalorieTag" style="display:none;"></div>
      </div>
    </div>

    <!-- 主便當各格（連最底固定自選醬汁） -->
    <div class="slots-list" id="slotsList"></div>

    <div class="bento-stamps-bar">
      <div class="stamp-box stamp-left">
        🐷 100%<br>無激素肉源
      </div>
      <div class="stamp-box stamp-mid">
        <div class="stamp-mid-top">低鹽·低糖·少油</div>
        <div class="stamp-mid-bot">🌱 0添加味精</div>
      </div>
      <div class="stamp-box stamp-right">
        🐔 嚴選<br>日本雞蛋
      </div>
    </div>
  </div>

  <div class="visitor-lock-hint">
    🔒 訪客模式：菜單由店主雲端同步，顧客抽籤後可直接截圖傳出！
  </div>

  <script>
    const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRU-nsCAXl2JXcKafCqn-qLYDkHYbtZ9g4MMU4QBqeFO3ex0xQ5WjPzKDgiqgjAM02wID7FF16aoLbI/pub?output=csv";

    const DEFAULT_CONFIG = {
      title: "健築家 健康五格自由砌",
      logo: "https://raw.githubusercontent.com/healthprint/5-compartment-bento-box/main/logo",
      notice: "📸 抽啱心水？歡迎直接截圖 (Cap 圖) 落單！"
    };

    const DEFAULT_MENU_DATA = [
      { id: "cat_protein", title: "蛋白質", badgeClass: "lbl-protein", pickCount: 1, items: ["麻辣雞髀肉 (~200g) ($63) (360kcal)", "芥末雞胸 (~100g) ($66) (145kcal)", "香草雞柳 (~100g) ($58) (135kcal)", "醉橙鴨胸 (~100g) ($68) (210kcal)", "豆腐咖喱 (~200g) ($58) (185kcal)", "挪威三文魚(刁草檸檬) (~80g) ($68) (165kcal)"] },
      { id: "cat_carb", title: "碳水/蔬菜", badgeClass: "lbl-carb", pickCount: 1, items: ["藜麥飯 150g(可免費增量至250g) (215kcal)", "薑黃椰香飯 (~150g) (240kcal)", "香烤南瓜 (~180g) (85kcal)", "榴槤番薯 (~180g) (160kcal)", "椰菜花 (~180g) (45kcal)", "西蘭花 (~180g) (60kcal)"] },
      { id: "cat_veggie", title: "蔬菜(2款)", badgeClass: "lbl-veggie", pickCount: 2, items: ["西蘭花(檸檬橄欖油) (50g) (32kcal)", "椰菜花(味噌) (50g) (25kcal)", "豆類(蒜蓉) (50g) (22kcal)", "什菌(焦糖洋蔥) (50g) (28kcal)", "椰菜(蝦米) (50g) (26kcal)"] },
      { id: "cat_side", title: "小菜", badgeClass: "lbl-side", pickCount: 1, items: ["昆布漬蘿蔔 (2片) (12kcal)", "麻藥蛋 (一隻) (78kcal)", "熟蛋 (一隻) (70kcal)", "熟蛋 (半隻) (35kcal)"] }
    ];

    let sauceItems = [
      "自家製辣茄醬 15g(+$5)",
      "煙燻青辣椒蛋黃醬 15g(+$5)"
    ];

    let siteConfig = { ...DEFAULT_CONFIG };
    let menuData = [...DEFAULT_MENU_DATA];
    let pickedResults = {};

    // 儲存醬汁勾選狀態
    let sauceCheckedMap = {};

    async function init() {
      const cached = localStorage.getItem("jzj_gsheet_cache");
      if (cached) {
        try {
          const parsed = JSON.parse(cached);
          if (parsed.menu) menuData = parsed.menu;
          if (parsed.config) siteConfig = parsed.config;
          if (parsed.sauces && parsed.sauces.length > 0) sauceItems = parsed.sauces;
        } catch(e) {}
      }
      applyConfig();
      renderBento();

      if (GOOGLE_SHEET_CSV_URL) {
        await fetchGoogleSheetData();
      }
    }

    async function fetchGoogleSheetData() {
      const statusEl = document.getElementById("cloudStatus");
      try {
        const res = await fetch(GOOGLE_SHEET_CSV_URL + "&_t=" + Date.now());
        if (!res.ok) throw new Error("讀取失敗");
        const csvText = await res.text();
        parseCSV(csvText);

        localStorage.setItem("jzj_gsheet_cache", JSON.stringify({ config: siteConfig, menu: menuData, sauces: sauceItems }));
        applyConfig();
        renderBento();
        statusEl.innerHTML = `<span>☁️</span> <span>已同步最新</span>`;
      } catch (e) {
        statusEl.innerHTML = `<span>☁️</span> <span>已同步</span>`;
      }
    }

    function parseCSV(csvText) {
      const lines = csvText.split(/\r?\n/).filter(line => line.trim().length > 0);
      if (lines.length <= 1) return;

      const map = {};
      const catOrder = [];
      const parsedSauces = [];

      for (let i = 1; i < lines.length; i++) {
        const parts = lines[i].split(",");
        if (parts.length < 2) continue;

        const colA = parts[0].replace(/^["']|["']$/g, '').trim();
        const colB = parts.slice(1).join(",").replace(/^["']|["']$/g, '').trim();

        if (!colA || !colB) continue;

        if (colA === "店舖名稱" || colA === "店名") {
          siteConfig.title = colB;
          continue;
        } else if (colA === "店舖圖標" || colA === "Logo" || colA === "logo" || colA === "商標") {
          siteConfig.logo = colB;
          continue;
        } else if (colA === "宣傳標語" || colA === "提示") {
          siteConfig.notice = colB;
          continue;
        } 
        
        // 只要包含「醬」或「追加」，一律歸入最底醬汁清單，絕不在上方重複出
        if (colA.includes("醬") || colA.includes("追加")) {
          parsedSauces.push(colB);
          continue;
        }

        if (!map[colA]) {
          map[colA] = [];
          catOrder.push(colA);
        }
        map[colA].push(colB);
      }

      if (parsedSauces.length > 0) {
        sauceItems = parsedSauces;
      }

      if (catOrder.length > 0) {
        menuData = catOrder.map(name => {
          let pickCount = 1;
          let badgeClass = "lbl-custom";

          const matchCount = name.match(/\((\d+)款\)/) || name.match(/\((\d+)份\)/);
          if (matchCount) {
            pickCount = parseInt(matchCount[1], 10);
          } else if (name.includes("兩款") || name.includes("2款")) {
            pickCount = 2;
          }

          if (name.includes("蛋白質") || name.includes("肉")) badgeClass = "lbl-protein";
          else if (name.includes("碳水") || name.includes("飯")) badgeClass = "lbl-carb";
          else if (name.includes("蔬菜")) badgeClass = "lbl-veggie";
          else if (name.includes("小菜") || name.includes("蛋")) badgeClass = "lbl-side";

          return {
            id: "cat_" + encodeURIComponent(name),
            title: name,
            badgeClass: badgeClass,
            pickCount: pickCount,
            items: map[name]
          };
        });
      }
    }

    function applyConfig() {
      document.title = siteConfig.title;
      document.getElementById("siteTitle").innerText = siteConfig.title;
      document.getElementById("siteNotice").innerText = siteConfig.notice;

      const logoEl = document.getElementById("siteLogo");
      const isImgUrl = siteConfig.logo && (
        siteConfig.logo.startsWith("http") || 
        siteConfig.logo.includes("/logo") || 
        siteConfig.logo.match(/\.(png|jpg|jpeg|svg|webp)/i)
      );

      if (isImgUrl) {
        logoEl.innerHTML = `<img src="${siteConfig.logo}" alt="Logo" style="height:52px; max-width:140px; object-fit:contain; border-radius:6px; display:block;">`;
      } else {
        logoEl.innerText = siteConfig.logo || "🥕";
      }
    }

    function renderBento() {
      const container = document.getElementById("slotsList");
      container.innerHTML = "";
      let totalPicks = 0;
      let calculatedBasePrice = 0;
      let extraSaucePrice = 0;
      let totalCalories = 0;
      let hasCalories = false;

      // 1. 渲染前 4 格（共 5 品）
      menuData.forEach((cat) => {
        totalPicks += cat.pickCount;
        const picked = pickedResults[cat.id] || [];
        const row = document.createElement("div");
        row.className = "slot-row";

        let contentHtml = "";
        if (picked.length === 0) {
          contentHtml = `<div class="slot-dish-item empty">請按上方按鈕隨機抽取</div>`;
        } else {
          contentHtml = picked.map((dish, i) => {
            const matchPrice = dish.match(/\$(\d+)/);
            if (matchPrice && (cat.title.includes('蛋白質') || cat.badgeClass === 'lbl-protein')) {
              calculatedBasePrice = parseInt(matchPrice[1], 10);
            }

            const matchCal = dish.match(/(\d+)\s*(kcal|卡|cal)/i);
            if (matchCal) {
              totalCalories += parseInt(matchCal[1], 10);
              hasCalories = true;
            }

            return `
              <div class="slot-dish-item">
                <span class="slot-dish-text">• ${dish}</span>
                ${picked.length > 1 ? `<span class="slot-dish-tag">(第${i+1}款)</span>` : ''}
              </div>
            `;
          }).join("");
        }

        row.innerHTML = `
          <div class="slot-label ${cat.badgeClass}">${cat.title}</div>
          <div class="slot-dish-list">${contentHtml}</div>
          <button class="btn-reroll-cat" onclick="rerollCategory('${cat.id}')" title="單獨重抽呢格">🔄</button>
        `;
        container.appendChild(row);
      });

      // 2. 渲染最底：「追加秘製醬汁」（固定顯示所有醬汁選項，無重抽掣）
      sauceItems.forEach((sauce) => {
        if (sauceCheckedMap[sauce]) {
          const matchPlus = sauce.match(/\+\$(\d+)/);
          if (matchPlus) extraSaucePrice += parseInt(matchPlus[1], 10);
          const matchCal = sauce.match(/(\d+)\s*(kcal|卡|cal)/i);
          if (matchCal) {
            totalCalories += parseInt(matchCal[1], 10);
            hasCalories = true;
          }
        }
      });

      const sauceRow = document.createElement("div");
      sauceRow.className = "slot-row";
      sauceRow.style.background = "#FFFDFE";
      sauceRow.style.borderColor = "#E1BEE7";

      let sauceContentHtml = "";
      if (sauceItems.length === 0) {
        sauceContentHtml = `<div class="slot-dish-item empty">(暫無醬汁可選)</div>`;
      } else {
        sauceContentHtml = sauceItems.map((sauce) => {
          const isChecked = sauceCheckedMap[sauce] ? 'checked' : '';
          return `
            <label class="sauce-option-item">
              <input type="checkbox" class="sauce-checkbox" ${isChecked} onchange="toggleSauceCheck('${sauce.replace(/'/g, "\\'")}', this.checked)">
              <span class="sauce-text">${sauce}</span>
              <span class="sauce-hint">可剔選</span>
            </label>
          `;
        }).join("");
      }

      // 移除了右邊的重抽按鈕 (🔄)
      sauceRow.innerHTML = `
        <div class="slot-label lbl-sauce">追加秘製醬汁</div>
        <div class="slot-dish-list">${sauceContentHtml}</div>
      `;
      container.appendChild(sauceRow);

      // 3. 套餐總價計算
      const finalPrice = calculatedBasePrice > 0 ? (calculatedBasePrice + extraSaucePrice) : null;
      document.getElementById("bentoTitleBadge").innerText = `🍱 五格自由砌 (共${totalPicks}品)`;
      
      if (finalPrice) {
        let priceText = `套餐總價：$${finalPrice}`;
        if (extraSaucePrice > 0) priceText += ` (含醬汁+$${extraSaucePrice})`;
        document.getElementById("bentoPriceTag").innerText = priceText;
      } else {
        document.getElementById("bentoPriceTag").innerText = `套餐：$58起`;
      }

      // 4. 總卡路里顯示
      const calTag = document.getElementById("bentoCalorieTag");
      if (hasCalories && totalCalories > 0) {
        calTag.style.display = "block";
        calTag.innerText = `🔥 總卡路里：約 ${totalCalories} kcal`;
      } else {
        calTag.style.display = "none";
      }
    }

    function toggleSauceCheck(sauceName, isChecked) {
      sauceCheckedMap[sauceName] = isChecked;
      renderBento();
    }

    function drawAllDishes() {
      menuData.forEach(cat => {
        pickedResults[cat.id] = pickRandomDishes(cat.items, cat.pickCount);
      });
      // 抽今日餐單時，醬汁保持客人原本的勾選狀態（或重設）
      renderBento();
      if (typeof confetti === 'function') confetti({ particleCount: 50, spread: 60, origin: { y: 0.3 } });
    }

    function rerollCategory(catId) {
      const cat = menuData.find(c => c.id === catId);
      if (!cat) return;
      pickedResults[cat.id] = pickRandomDishes(cat.items, cat.pickCount);
      renderBento();
    }

    function pickRandomDishes(items, count) {
      if (!items || items.length === 0) return ["(暫無可選)"];
      const shuffled = [...items].sort(() => 0.5 - Math.random());
      return shuffled.slice(0, Math.min(count, items.length));
    }

    function copyMenuText() {
      let text = `🍱 ${siteConfig.title}·今日落單：\n`;
      let hasItem = false;
      let totalCalories = 0;
      let basePrice = 0;
      let saucePrice = 0;

      menuData.forEach(cat => {
        const picked = pickedResults[cat.id];
        if (picked && picked.length > 0) {
          hasItem = true;
          text += `▪️ ${cat.title}：${picked.join(" ＋ ")}\n`;
          picked.forEach(dish => {
            const matchPrice = dish.match(/\$(\d+)/);
            if (matchPrice && (cat.title.includes('蛋白質') || cat.badgeClass === 'lbl-protein')) {
              basePrice = parseInt(matchPrice[1], 10);
            }
            const matchCal = dish.match(/(\d+)\s*(kcal|卡|cal)/i);
            if (matchCal) totalCalories += parseInt(matchCal[1], 10);
          });
        }
      });

      if (!hasItem) { alert("請先撳「🎲 隨機抽今日餐單！」抽取菜式！"); return; }

      // 檢查醬汁勾選
      const chosenSauces = [];
      sauceItems.forEach((sauce) => {
        if (sauceCheckedMap[sauce]) {
          chosenSauces.push(sauce);
          const matchPlus = sauce.match(/\+\$(\d+)/);
          if (matchPlus) saucePrice += parseInt(matchPlus[1], 10);
          const matchCal = sauce.match(/(\d+)\s*(kcal|卡|cal)/i);
          if (matchCal) totalCalories += parseInt(matchCal[1], 10);
        }
      });

      if (chosenSauces.length > 0) {
        text += `▪️ 追加秘製醬汁：${chosenSauces.join(" ＋ ")}\n`;
      } else {
        text += `▪️️ 追加秘製醬汁：不需要醬汁\n`;
      }

      if (basePrice > 0) {
        const finalP = basePrice + saucePrice;
        text += `💰 套餐總額：$${finalP}${saucePrice > 0 ? ` (含醬汁+$${saucePrice})` : ''}\n`;
      }

      if (totalCalories > 0) {
        text += `🔥 總卡路里：約 ${totalCalories} kcal\n`;
      }

      navigator.clipboard.writeText(text).then(() => alert("✅ 餐單文字已複製到剪貼簿！"));
    }

    init();
  </script>
</body>
</html>
