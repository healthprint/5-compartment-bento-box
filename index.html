<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>健築家 健康五格自由砌</title>

  <style>
    :root {
      --bg-cream: #faf7f2;
      --card-bg: #ffffff;
      --text-dark: #333333;
      --text-muted: #666666;
      --primary-red: #c0392b;
      --btn-hover: #a93226;
      --badge-protein: #fed7aa;
      --badge-protein-text: #7c2d12;
      --badge-staple: #fde68a;
      --badge-staple-text: #78350f;
      --badge-veg: #bbf7d0;
      --badge-veg-text: #14532d;
      --badge-side: #bae6fd;
      --badge-side-text: #0c4a6e;
      --border-gray: #e2e8f0;
      --extra-bg: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-cream);
      color: var(--text-dark);
      display: flex;
      justify-content: center;
      padding: 16px 12px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 頂部標頭 */
    .header-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .brand-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-logo {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }
    .brand-name {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .status-badge {
      background: #e8f5e9;
      color: #2e7d32;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
